<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image" href="https://img.icons8.com/?size=100&id=3J8ksELUwTUa&format=png&color=000000"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
<!-- Made by gilbarbara: https://github.com/gilbarbara/logos -->
<!-- License: MIT. Made by radix-ui: https://github.com/radix-ui/icons -->
 <!-- License: MIT. Made by H2D2 Design: https://github.com/h2d2-design/h2d2-shopicons -->
    <title>Youtube Copy</title>
    <style> 
      .page-load{
        position: absolute;
        display: flex;
        flex-direction: column;
        background-color: #0f0f0f;
        width: 100%;
        height: 100%;
        top: 0;
        left: 0;
        gap: 30px;
      }
      .nav-load{
        display: flex;
        flex-direction: row;
        justify-content: space-between;
        align-items: center;
        padding: 10px;
      }
      .nav-text-load{
        border-radius: 16px;
        background-color: gray;
        width: 200px;
        height: 20px;
      }
      .content-load{
        display: flex;
        flex-direction: row;
        justify-content: space-around;
        align-items: center;
        flex-wrap: wrap;
        
      }
      .content-card-load{
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        padding: 10px;
        background-color: gray;
        width: 300px;
        height: 400px;
        border-radius: 16px;
        gap: 30px;
        text-align: left;

      }
      .content-card-image-load{
        border-radius: 24px;
        height: 60%;
        width: 100%;
        
      }
      .content-card-text-load{
        border-radius: 24px;
        height: 5%;
        width: 100%;
      }
      .content-card-text-load:last-child{
        border-radius: 24px;
        height: 5%;
        width: 95%;
      }
      .skeleton{

        animation: skeleton 1s linear infinite alternate;

      }
      @keyframes skeleton {
        0%{
          background-color: #cacaca33;
        }
        100%{
          background-color: #cacaca94;
        }
      }
    </style>
  </head>
  <body>
    <div class="page-load" id="skeleton-page">
      <div class="nav-load">
        <div class="nav-text-load skeleton"></div>
        <div class="nav-text-load skeleton"></div>
        <div class="nav-text-load skeleton"></div>
      </div>
      <div class="content-load">
        <div class="content-card-load skeleton">
          <div class="content-card-image-load skeleton"></div>
          <div class="content-card-text-load skeleton"></div>
          <div class="content-card-text-load skeleton"></div>
          <div class="content-card-text-load skeleton"></div>
        </div>
        <div class="content-card-load skeleton">
          <div class="content-card-image-load skeleton"></div>
          <div class="content-card-text-load skeleton"></div>
          <div class="content-card-text-load skeleton"></div>
          <div class="content-card-text-load skeleton"></div>
        </div>
        <div class="content-card-load skeleton">
          <div class="content-card-image-load skeleton"></div>
          <div class="content-card-text-load skeleton"></div>
          <div class="content-card-text-load skeleton"></div>
          <div class="content-card-text-load skeleton"></div>
        </div>
        <div class="content-card-load skeleton">
          <div class="content-card-image-load skeleton"></div>
          <div class="content-card-text-load skeleton"></div>
          <div class="content-card-text-load skeleton"></div>
          <div class="content-card-text-load skeleton"></div>
        </div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
